<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ConstruMarket — Marketplace de Serviços</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Ícones opcionais -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="py-3 bg-azul text-white shadow-sm">
      <div
        class="container d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3"
      >
        <div class="d-flex align-items-center gap-2">
          <div class="logo-circle">CM</div>
          <div>
            <h1 class="h5 mb-0 fw-bold">ConstruMarket</h1>
            <small class="text-azul-claro"
              >Serviços e profissionais da construção</small
            >
          </div>
        </div>

        <div class="input-group w-100 w-lg-50">
          <input
            id="searchInput"
            type="search"
            class="form-control"
            placeholder="Buscar por serviço, profissional ou cidade..."
          />
          <button id="btnSearch" class="btn btn-laranja">
            <i class="bi bi-search"></i>
          </button>
        </div>

        <div class="d-flex gap-2">
          <button id="btnLogin" class="btn btn-outline-light">Entrar</button>
          <button id="btnPublish" class="btn btn-laranja">
            Divulgar serviço
          </button>
        </div>
      </div>
    </header>

    
    <main class="container my-4">
      <div class="row g-4">
        <!-- SIDEBAR / FILTROS -->
        <aside class="col-lg-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title mb-3">Filtros</h5>

              <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select id="filterCategory" class="form-select">
                  <option value="">Selecione uma categoria</option>
                  <option>Arquiteto(a)</option>
                  <option>Armador(a) de Ferragens</option>
                  <option>Azulejista / Pisagista</option>
                  <option>Bombeiro(a) Hidráulico / Encanador(a)</option>
                  <option>Calheiro(a)</option>
                  <option>Carpinteiro(a)</option>
                  <option>Desentupidor(a)</option>
                  <option>Designer de Interiores</option>
                  <option>Eletricista</option>
                  <option>Engenheiro(a) Civil</option>
                  <option>Gesseiro(a)</option>
                  <option>Impermeabilizador(a)</option>
                  <option>Instalador(a) de Ar Condicionado</option>
                  <option>Instalador(a) de Drywall</option>
                  <option>Instalador(a) de Gás</option>
                  <option>Instalador(a) de Sistemas de Segurança</option>
                  <option>Jardineiro(a) / Paisagista</option>
                  <option>Limpador(a) Pós-Obra</option>
                  <option>Marceneiro(a)</option>
                  <option>Marido de Aluguel</option>
                  <option>Mestre de Obras</option>
                  <option>Montador(a) de Andaimes</option>
                  <option>Montador(a) de Móveis</option>
                  <option>Terraplanagem</option>
                  <option>Pedreiro(a)</option>
                  <option>Pintor(a)</option>
                  <option>Serralheiro(a)</option>
                  <option>Técnico(a) em Edificações</option>
                  <option>Topógrafo(a)</option>
                  <option>Vidraceiro(a)</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Cidade</label>
                <input
                  id="filterCity"
                  type="text"
                  class="form-control"
                  placeholder="ex: São Paulo"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Faixa de preço</label>
                <select id="filterPrice" class="form-select">
                  <option value="">Qualquer</option>
                  <option value="0-100">Até R$100</option>
                  <option value="100-500">R$100 — R$500</option>
                  <option value="500-2000">R$500 — R$2.000</option>
                  <option value="2000+">R$2.000+</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Ordenar por</label>
                <select id="sortBy" class="form-select">
                  <option value="relevance">Relevância</option>
                  <option value="ratingDesc">Avaliação (maior)</option>
                  <option value="priceAsc">Preço (menor)</option>
                  <option value="priceDesc">Preço (maior)</option>
                  <option value="newest">Mais recentes</option>
                </select>
              </div>

              <hr />
              <h6>Anúncios futuros</h6>
              <p class="text-muted small mb-0">
                Espaço reservado para anúncios pagos e promoções.
              </p>
            </div>
          </div>
        </aside>

        <!-- LISTAGEM -->
        <section class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Anúncios de serviços</h4>
            <div id="resultsInfo" class="text-muted small">
              Mostrando <span id="countResults">0</span> resultados
            </div>
          </div>

          <div id="cardsContainer" class="row g-3"></div>

          <div
            id="noResults"
            class="alert alert-warning text-center mt-4"
            hidden
          >
            Nenhum serviço encontrado. Tente outros filtros.
          </div>
        </section>
      </div>
    </main>

    <!-- MODAL -->
    <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Divulgar serviço</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <form id="serviceForm" class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome do serviço / empresa</label>
                <input name="title" required class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Categoria</label>
                <select name="category" class="form-select" required>
                  <option>Pedreiro</option>
                  <option>Eletricista</option>
                  <option>Hidráulica</option>
                  <option>Marcenaria</option>
                  <option>Engenharia</option>
                  <option>Arquitetura</option>
                  <option>Marido-de-aluguel</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Preço médio (R$)</label>
                <input
                  name="price"
                  type="number"
                  min="0"
                  required
                  class="form-control"
                />
              </div>

              <div class="col-md-4">
                <label class="form-label">Cidade</label>
                <input name="city" required class="form-control" />
              </div>

              <div class="col-md-4">
                <label class="form-label">Contato</label>
                <input
                  name="contact"
                  class="form-control"
                  placeholder="telefone / e-mail / WhatsApp"
                />
              </div>

              <div class="col-12">
                <label class="form-label">Descrição</label>
                <textarea
                  name="description"
                  rows="3"
                  class="form-control"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-laranja">Publicar</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-light py-3 mt-4 border-top">
      <div class="container d-flex justify-content-between small text-muted">
        <div>&copy; <span id="year"></span> Vilander Costa</div>
        <div>Projeto Integrador - TII</div>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
